experiment_name: "llama31_8b_base"          # used for the results/<name>/ output directory

model:
  name: "meta-llama/Llama-3.1-8B"           # HuggingFace model ID or local path
  type: "base"                              # "instruct" | "base"   (controls chat template usage)
  family: "llama"                           # "llama" | "gemma"     (selects prompt formatter)
  dtype: "bfloat16"                         # "bfloat16" | "float16" | "float32"
  trust_remote_code: false                  # true to allow custom modeling code in the HF repo
  device: "cuda:1"                          # "cuda" | "cuda:N" | "cpu" | "auto" (multi-GPU device_map)

sae:
  release: "llama_scope_lxr_32x"            # sae_lens release name
  base_sae_id: "l0r_32x"                    # layer number is substituted automatically (l0 -> lN)

steering:
  layers: []                                # list of layers, or "all" (= every layer with a mean-diff file)
  alpha: []                                 # steering strengths to sweep
  mean_diff_path: ""                        # dir of layer_NN_mean_diff.json files (REQUIRED unless --mean-diff-path is passed)
  mean_diff_direction: "pos"                # "pos" | "neg" | "all"  (use top_positive, top_negative, or both)


benchmarks:                                 # subset of available benchmarks to run; remove any line to skip
  - mmlu
  - elephant_oeq
  - elephant_aita
  - elephant_ss

judge:
  model: "gpt-4o-mini"                      # OpenAI model used by the judge
  concurrency: 32                           # max concurrent OpenAI requests

output:
  base_dir: "{work_dir}/../results/llama31_8b_base"  # where scores/generations land

run:
  batch_size: 64                            # default generation batch size
  batch_sizes:                              # per-benchmark overrides (omit to use the default above)
    mmlu: 64
    elephant_oeq: 64
    elephant_aita: 64
    elephant_ss: 64

task:
  multiple_choice:                          # mmlu
    generation:
      max_new_tokens: 256
      temperature: 0.0                      # 0.0 = greedy
      do_sample: false                      # must be false when temperature == 0
      top_p: 1.0
  open_ended:                               # elephant_oeq, elephant_aita, elephant_ss
    generation:
      max_new_tokens: 512
      temperature: 0.6
      do_sample: true
      top_p: 0.9